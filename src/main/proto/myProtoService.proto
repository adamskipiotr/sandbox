syntax = "proto3";
option java_multiple_files = true; // required so java code is generated to separate files instead of single one
package pada.testowe;

service GreetingService {
  rpc sayHello (ParkRequest) returns (ParkResponse);
}

message Vehicle {
  string vehicle_number = 1;
  string vehicle_type = 2;
}

message ParkRequest {
  Vehicle vehicle = 1;
}

message ParkResponse {
  string response_message = 1;
}

message ParkResponseManyTimes {
  string message = 1;
  int64 count = 2;
}
